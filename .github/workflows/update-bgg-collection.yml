name: Update BGG collection

"on":
  schedule:
    # 매일 한국 시간 오전 6시 (UTC 21:00 전날) 실행. 필요하면 시간 바꿔도 됨.
    - cron: '0 21 * * *'
  workflow_dispatch: {}   # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: BGG 컬렉션 CSV 받기
        env:
          BGG_USERNAME: ${{ vars.BGG_USERNAME }}
        run: |
          curl -sL --retry 5 --retry-delay 10 \
            "https://boardgamegeek.com/geekcollection.php?action=exportcsv&subtype=boardgame&username=${BGG_USERNAME}&all=1" \
            -o collection.csv
          # BGG가 큰 컬렉션은 비동기로 처리 요청("please try again later")을 응답할 때가 있어서 재시도
          if grep -qi "please try again" collection.csv; then
            echo "BGG가 처리 중이라 30초 후 재시도"
            sleep 30
            curl -sL --retry 5 --retry-delay 10 \
              "https://boardgamegeek.com/geekcollection.php?action=exportcsv&subtype=boardgame&username=${BGG_USERNAME}&all=1" \
              -o collection.csv
          fi

      - name: 받아온 파일 확인용 디버그 출력
        run: |
          echo "--- 파일 크기 ---"
          wc -c collection.csv
          echo "--- 앞 20줄 ---"
          head -n 20 collection.csv

      - name: collection.csv를 아티팩트로 업로드 (직접 열어보기용)
        uses: actions/upload-artifact@v4
        with:
          name: raw-collection-csv
          path: collection.csv

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: CSV -> JSON 변환
        run: python scripts/csv_to_json.py collection.csv docs/collection.json

      - name: 변경사항 커밋
        run: |
          git config user.name "bgg-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/collection.json
          git diff --cached --quiet && echo "변경 없음, 커밋 생략" || git commit -m "chore: BGG 컬렉션 갱신 ($(date -u +%Y-%m-%d))"
          git push
