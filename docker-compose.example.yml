# 이 파일을 docker-compose.yml로 복사해 값을 채운다.
# 실제 파일에는 API 키가 들어가므로 .gitignore로 막아 뒀다.
#
# 이미지는 PC에서 빌드해 tar로 옮긴 뒤 docker load로 넣는다. NAS에 소스는 필요 없다.
#   PC:  docker build -t bgg-collection:latest .
#        docker save bgg-collection:latest -o bgg-collection.tar
#   NAS: docker load -i bgg-collection.tar
#        docker compose up -d
services:
  bgg:
    image: bgg-collection:latest
    container_name: bgg
    restart: unless-stopped
    network_mode: bridge
    ports:
      # NAS 포트:컨테이너 포트. 왼쪽만 비어 있는 번호로 바꾸면 된다.
      - 3000:3001
    volumes:
      # 기록·컬렉션·사진·이미지 캐시가 전부 여기 쌓인다. 백업은 이 폴더만 뜨면 된다.
      # 앱마다 따로 써야 한다 - 다른 앱 폴더를 가리키면 데이터가 섞인다.
      - /share/Container/bgg/data:/app/data
    environment:
      # 게임을 새로 추가할 때 긱에서 정보를 받아오는 데 쓴다. 없으면 그 기능만 안 된다.
      - BGG_API_KEY=
      - TZ=Asia/Seoul
      # 주 1회 자동 청소(안 쓰는 긱 이미지·고아 파일 정리). 끄려면 0.
      - AUTO_CLEANUP=1
